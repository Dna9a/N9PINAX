<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices - N9pinax</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon btn-ghost" onclick="toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search IP / hostname / vendor…" id="deviceSearch">
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-icon btn-ghost" id="themeToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-moon hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Devices</h1>
            <p class="page-subtitle">Hosts discovered in the most recent scan</p>
          </div>
          <div class="flex gap-2">
            <select class="form-select" id="riskFilter" style="width: 150px;">
              <option value="all">All Risk</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <button class="btn btn-primary" id="refreshScanBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              Rescan
            </button>
          </div>
        </div>

        <div class="stats-grid mb-6">
          <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total Devices</div></div>
          <div class="stat-card"><div class="stat-value" id="statOnline">—</div><div class="stat-label">Online</div></div>
          <div class="stat-card"><div class="stat-value" id="statOffline">—</div><div class="stat-label">Offline</div></div>
          <div class="stat-card"><div class="stat-value" id="statHigh">—</div><div class="stat-label">High Risk</div></div>
        </div>

        <div class="card">
          <div class="card-body p-0">
            <div class="table-container">
              <table class="table" id="devicesTable">
                <thead>
                  <tr>
                    <th>IP Address</th><th>MAC Address</th><th>Vendor</th><th>Hostname</th>
                    <th>OS</th><th>Type</th><th>Risk</th><th>Ports</th>
                  </tr>
                </thead>
                <tbody id="devicesBody">
                  <tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer flex items-center justify-between">
            <span class="text-sm text-muted" id="deviceCount">—</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/chrome.js"></script>
  <script src="../js/devices.js"></script>
</body>
</html>
