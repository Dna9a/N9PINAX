<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N9pinax - Enterprise Cybersecurity Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <!-- Theme Toggle -->
    <button type="button" aria-label="Toggle light/dark theme" aria-pressed="false" class="btn btn-icon btn-ghost theme-toggle" id="themeToggle" title="Toggle theme">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon hidden">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="login-center-wrapper">
    <div class="login-container">
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">N9</div>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to N9pinax Security Platform</p>
      </div>

      <!-- Form card -->
      <div class="login-card">
        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Username or email</label>
            <input type="text" id="email" class="form-input" placeholder="Username or email" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <div id="loginError" class="alert alert-danger" style="display:none;"></div>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" class="form-checkbox" id="remember">
              <span class="text-secondary">Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
            <span>Sign in</span>
            <svg aria-hidden="true" class="spinner hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
          </button>
        </form>

        <p class="login-footer-text">
          Don't have an account? <span class="text-secondary">Ask your administrator to create one.</span>
        </p>
      </div><!-- /.login-card -->
    </div><!-- /.login-container -->
    </div><!-- /.login-center-wrapper -->

    <!-- ── Page Footer — full width ───────────────────────────── -->
    <footer class="login-page-footer">
      <div class="login-page-footer-inner">
        <!-- Brand -->
        <div class="login-page-footer-brand">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 18c0-3 1-5 3-6.5C8 10 9 9 9 7.5A2.5 2.5 0 0 1 14 7c0 1.5 1 2.5 2 3.5 2 1.5 3 3.5 3 6.5"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--accent-primary)"/>
            <path d="M4 18h16M8 18v1m8-1v1"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--accent-primary)"/>
          </svg>
          <span><span class="gold">N9</span>PINAX</span>
        </div>

        <!-- Links -->
        <div class="login-page-footer-links">
          <span>&copy; 2025 N9PINAX</span>
          <span class="sep">&middot;</span>
          <a href="https://github.com/Dna9a" target="_blank" rel="noopener">Who's behind this?</a>
          <span class="sep">&middot;</span>
          <a href="https://n9pinax.vercel.app" target="_blank" rel="noopener">Documentation</a>
        </div>

        <!-- Status -->
        <div class="login-page-footer-status">
          <span class="status-dot-sm"></span>
          All systems operational
        </div>
      </div>
    </footer>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Already logged in? Skip straight to the dashboard.
    if (localStorage.getItem('authToken')) {
      window.location.href = 'pages/dashboard.html';
    }

    const errorBox = document.getElementById('loginError');
    function showLoginError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const spinner = btn.querySelector('.spinner');
      const text = btn.querySelector('span');

      btn.disabled = true;
      text.textContent = 'Signing in...';
      spinner.classList.remove('hidden');

      try {
        const base = localStorage.getItem('apiBaseUrl') || '';
        const response = await fetch(`${base}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userRole', data.role || '');
          localStorage.setItem('role', data.role || '');
          localStorage.setItem('userEmail', data.email || email);
          window.location.href = 'pages/dashboard.html';
          return;
        }

        let detail = 'Invalid credentials';
        if (response.status === 429) {
          detail = 'Too many attempts — please wait a minute and try again.';
        } else {
          try { const b = await response.json(); if (b && b.detail) detail = b.detail; } catch (_) {}
        }
        showLoginError(detail);
      } catch (err) {
        showLoginError('Network error — is the backend reachable?');
      } finally {
        btn.disabled = false;
        text.textContent = 'Sign in';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
